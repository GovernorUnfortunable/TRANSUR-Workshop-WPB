          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Facet'
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Facet'
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Facet'
  /api/v1/theses/completion/:
    get:
      tags:
      - search-theses-controller
      summary: "Proposer l'automcompletion basée sur les mots clés libres, les mots\
        \ clés rameau et la discipline"
      description: Retourne 10 propositions
      operationId: completion
      parameters:
      - name: q
        in: query
        description: début de la chaine à rechercher
        required: true
        schema:
          type: string
        example: indus
      responses:
        "200":
          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                type: array
                items:
                  type: string
  /api/v1/theses/checkNNT/{numSujet}:
    get:
      tags:
      - these-controller
      summary: Renvoyer le NNT d'une thèse à partir de son numSujet
      description: "Si le numSujet (idStep) correspond également à une thèse soutenue\
        \ et validée dans STAR, renvoi le NNT correspondant"
      operationId: getNntIfExist
      parameters:
      - name: numSujet
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                type: string
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                type: string
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                type: string
  /api/v1/tests/personnes/recherche:
    get:
      tags:
      - personne-test-controller
      summary: Rechercher une personne avec un mot
      description: Retourne une liste de personnes correspondant à la recherche
      operationId: recherche
      parameters:
      - name: q
        in: query
        description: début de la chaine à rechercher
        required: true
        schema:
          type: string
        example: rousseau
      - name: index
        in: query
        description: nom de l'index à réquêter
        required: true
        schema:
          type: string
        example: personnes
      - name: filtres
        in: query
        description: filtres
        required: false
        schema:
          type: string
        example: "[role=\"auteurs\"&role=\"rapporteurs\"]"
      - name: debut
        in: query
        description: indice de la première personne du lot
        required: false
        schema:
          type: integer
          format: int32
        example: 10
      - name: nombre
        in: query
        description: nombre de personne dans le lot
        required: false
        schema:
          type: integer
          format: int32
        example: 10
      - name: tri
        in: query
        description: Type de tri
        required: false
        schema:
          type: string
        example: "pertinence, PersonneDesc, PersonnesAsc"
      responses:
        "200":
          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RechercheResponseDto'
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RechercheResponseDto'
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/RechercheResponseDto'
      deprecated: true
  /api/v1/tests/personnes/personne/{id}:
    get:
      tags:
      - personne-test-controller
      summary: Rechercher une personne par son identifiant
      description: Retourne la personne correspondante à la recherche
      operationId: rechercherParIdentifiant
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: index
        in: query
        description: nom de l'index à réquêter
        required: true
        schema:
          type: string
        example: personnes
      responses:
        "200":
          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PersonneResponseDto'
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PersonneResponseDto'
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/PersonneResponseDto'
      deprecated: true
  /api/v1/tests/personnes/facets:
    get:
      tags:
      - personne-test-controller
      summary: Retourne une liste de facettes avec le nombre d'ocurence pour chaque
        facette
      description: Retourne une liste de facettes en fonction du critère de recherche
      operationId: facets_1
      parameters:
      - name: q
        in: query
        description: début de la chaine à rechercher
        required: true
        schema:
          type: string
        example: rousseau
      - name: index
        in: query
        description: nom de l'index à réquêter
        required: true
        schema:
          type: string
        example: personnes
      - name: filtres
        in: query
        description: filtres
        required: false
        schema:
          type: string
        example: "[role=\"auteurs\"&role=\"rapporteurs\"]"
      responses:
        "200":
          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Facet'
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Facet'
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Facet'
      deprecated: true
  /api/v1/tests/personnes/completion:
    get:
      tags:
      - personne-test-controller
      summary: Proposer l'autocompletion basée sur les noms et prénoms
      description: Retourne 10 propositions avec une priorité sur les personnes avec
        un identifiant Idref
      operationId: completion_1
      parameters:
      - name: q
        in: query
        description: début de la chaine à rechercher
        required: true
        schema:
          type: string
        example: indus
      - name: index
        in: query
        description: nom de l'index à réquêter
        required: true
        schema:
          type: string
        example: personnes
      responses:
        "200":
          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SuggestionResponseDto'
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SuggestionResponseDto'
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SuggestionResponseDto'
      deprecated: true
  /api/v1/personnes/stats:
    get:
      tags:
      - personne-controller
      summary: Statistiques sur les personnes
      description: Retourne le nombre total de personnes
      operationId: getStatsPersonnes
      responses:
        "200":
          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                type: integer
                format: int64
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                type: integer
                format: int64
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                type: integer
                format: int64
