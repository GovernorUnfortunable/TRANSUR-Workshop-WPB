openapi: 3.0.1
info:
  title: API recherche de theses.fr
  description: Cette API permet de lancer une recherche dans les données de theses.fr
    décrivant les thèses et les personnes liées aux thèses. Les données sont récupérables
    au format JSON.
  version: "1.0"
servers:
- url: https://theses.fr
paths:
  /api/v1/theses/these/signaler/:
    post:
      tags:
      - these-controller
      summary: Signaler une erreur sur une page de these
      description: "Envoie un mail à l'établissement concerné, avec les informations\
        \ saisies dans le formulaire"
      operationId: signalerErreur
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignalerErreurDto'
        required: true
      responses:
        "200":
          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                type: string
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                type: string
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                type: string
  /api/v1/theses/these/{id}:
    get:
      tags:
      - these-controller
      summary: Renvoyer une thèse à partir de son nnt
      description: Retourne la thèse correspondante au nnt
      operationId: getThese
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TheseResponseDto'
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TheseResponseDto'
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TheseResponseDto'
  /api/v1/theses/statsTheses:
    get:
      tags:
      - search-theses-controller
      summary: Retourne le nombre de theses soutenues
      operationId: statsTheses
      responses:
        "200":
          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                type: integer
                format: int64
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                type: integer
                format: int64
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                type: integer
                format: int64
  /api/v1/theses/statsSujets:
    get:
      tags:
      - search-theses-controller
      summary: Retourne le nombre de theses en préparation
      operationId: statsSujets
      responses:
        "200":
          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                type: integer
                format: int64
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                type: integer
                format: int64
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                type: integer
                format: int64
  /api/v1/theses/rss:
    get:
      tags:
      - search-theses-controller
      operationId: rss
      responses:
        "200":
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/View'
  /api/v1/theses/rechercheCSV:
    get:
      tags:
      - search-theses-controller
      summary: Rechercher une thèse via le titre et exporter le résultat dans un fichier
        CSV
      description: Retourne une liste de thèses correspondant à la recherche au format
        CSV
      operationId: simpleToCSV
      parameters:
      - name: q
        in: query
        description: chaine à rechercher
        required: true
        schema:
          type: string
        example: technologie
      - name: tri
        in: query
        description: Type de tri
        required: false
        schema:
          type: string
        example: "dateAsc, dateDesc, auteursAsc, auteursDesc, disciplineAsc, discplineDesc"
      - name: filtres
        in: query
        description: filtres
        required: false
        schema:
          type: string
        example: "[discipline=\"arts (histoire, theorie, pratique)\"&discipline=\"\
          etudes germaniques\"&discipline=\"architecture\"&langues=\"fr\"]"
      responses:
        "200":
          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                type: string
                format: binary
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                type: string
                format: binary
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                type: string
                format: binary
  /api/v1/theses/recherche/:
    get:
      tags:
      - search-theses-controller
      summary: Rechercher une thèse via le titre
      description: Retourne une liste de thèses correspondant à la recherche
      operationId: simple
      parameters:
      - name: q
        in: query
        description: chaine à rechercher
        required: true
        schema:
          type: string
        example: technologie
      - name: debut
        in: query
        description: indice de la première thèse du lot
        required: false
        schema:
          type: integer
          format: int32
        example: 10
      - name: nombre
        in: query
        description: nombre de thèse du lot
        required: false
        schema:
          type: integer
          format: int32
        example: 10
      - name: tri
        in: query
        description: Type de tri
        required: false
        schema:
          type: string
        example: "dateAsc, dateDesc, auteursAsc, auteursDesc, disciplineAsc, discplineDesc"
      - name: filtres
        in: query
        description: filtres
        required: false
        schema:
          type: string
        example: "[discipline=\"arts (histoire, theorie, pratique)\"&discipline=\"\
          etudes germaniques\"&discipline=\"architecture\"&langues=\"fr\"]"
      responses:
        "200":
          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResponseTheseLiteDto'
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResponseTheseLiteDto'
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResponseTheseLiteDto'
  /api/v1/theses/organisme/{ppn}:
    get:
      tags:
      - search-theses-controller
      summary: Rechercher toutes les thèses liées à un établissement/organisme
      description: "Retourne une liste de thèses correspondant liées à un établissement,\
        \ groupées par rôle de l'établissement"
      operationId: rechercheParOrganisme
      parameters:
      - name: ppn
        in: path
        description: PPN de l'établissement/organisme
        required: true
        schema:
          type: string
        example: 241345251
      responses:
        "200":
          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ThesesByOrganismeResponseDto'
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ThesesByOrganismeResponseDto'
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ThesesByOrganismeResponseDto'
  /api/v1/theses/getorganismename/{ppn}:
    get:
      tags:
      - search-theses-controller
      summary: Obtenir le nom d'un organisme
      description: "Retourne le nom d'un organisme. Si ce nom est vide, alors ce PPN\
        \ ne correspond pas à un organisme, mais à une personne."
      operationId: isOrganisme
      parameters:
      - name: ppn
        in: path
        description: PPN de l'établissement/organisme
        required: true
        schema:
          type: string
        example: 241345251
      responses:
        "200":
          description: Opération terminée avec succès
          content:
            '*/*':
              schema:
                type: string
        "503":
          description: Service indisponible
          content:
            '*/*':
              schema:
                type: string
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                type: string
  /api/v1/theses/facets/:
    get:
      tags:
      - search-theses-controller
      summary: Retourne une liste de facets/filtres pour une recherche simple
      operationId: facets
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
      - name: filtres
        in: query
        description: filtres
        required: false
