    get:
      tags:
      - personne-controller
      summary: Retourne une liste de facettes avec le nombre d'ocurence pour chaque
        facette
      description: Retourne une liste de facettes en fonction du critère de recherche
      operationId: facets_2
      parameters:
      - name: q
        in: query
        description: début de la chaine à rechercher
        required: true
        schema:
          type: string
        example: rousseau
      - name: filtres
