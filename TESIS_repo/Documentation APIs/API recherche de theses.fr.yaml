          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SuggestionResponseDto'
        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/SuggestionResponseDto'
components:
  schemas:
    SignalerErreurDto:
      type: object
      properties:
        token:
          type: string
        url:
          type: string
        nom:
          type: string
        prenom:
          type: string
        mail:
          type: string
        domaine:
          type: string
        objet:
          type: string
        question:
          type: string
        appSource:
          type: string
        etabPpn:
          type: string
    OrganismeResponseDto:
      type: object
      properties:
        ppn:
          type: string
        nom:
          type: string
        type:
          type: string
    SujetsToMap:
      type: object
      properties:
        keyword:
          type: string
        type:
          type: string
          enum:
          - sujet
          - sujetsRameau
        query:
          type: string
    ThesePersoneResponseDto:
      type: object
      properties:
        ppn:
          type: string
        nom:
          type: string
        prenom:
          type: string
    TheseResponseDto:
      type: object
      properties:
        titrePrincipal:
          type: string
        nnt:
          type: string
        doi:
          type: string
        numSujet:
          type: string
        dateSoutenance:
          type: string
        datePremiereInscriptionDoctorat:
          type: string
        discipline:
          type: string
        titres:
          type: object
          additionalProperties:
            type: string
        resumes:
          type: object
          additionalProperties:
            type: string
        etabSoutenance:
          $ref: '#/components/schemas/OrganismeResponseDto'
        codeEtab:
          type: string
        etabCotutelle:
          type: array
          items:
            $ref: '#/components/schemas/OrganismeResponseDto'
        partenairesRecherche:
          type: array
          items:
            $ref: '#/components/schemas/OrganismeResponseDto'
        mapSujets:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/SujetsToMap'
        membresJury:
          type: array
          items:
            $ref: '#/components/schemas/ThesePersoneResponseDto'
        rapporteurs:
          type: array
          items:
            $ref: '#/components/schemas/ThesePersoneResponseDto'
        auteurs:
          type: array
          items:
            $ref: '#/components/schemas/ThesePersoneResponseDto'
        directeurs:
          type: array
          items:
            $ref: '#/components/schemas/ThesePersoneResponseDto'
        langues:
          type: array
          items:
            type: string
        cas:
          type: string
        accessible:
          type: string
        ecolesDoctorales:
          type: array
          items:
            $ref: '#/components/schemas/OrganismeResponseDto'
        presidentJury:
          $ref: '#/components/schemas/ThesePersoneResponseDto'
        source:
          type: string
        status:
          type: string
        isSoutenue:
          type: boolean
    View:
