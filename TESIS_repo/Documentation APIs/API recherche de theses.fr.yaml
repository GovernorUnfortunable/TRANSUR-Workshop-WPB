        "400":
          description: Mauvaise requête
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Facet'
  /api/v1/personnes/completion:
    get:
      tags:
      - personne-controller
      summary: Proposer l'autocompletion basée sur les noms et prénoms
      description: Retourne 10 propositions avec une priorité sur les personnes avec
